name: Sorry Delta Comment
# Posts the verification-delta PR comment after Lean Verification completes.
# workflow_run runs in the base-repo context, so it has write access even for
# fork PRs. All logic lives in veritooling's reusable workflow.

on:
  workflow_run:
    workflows: ["Lean Verification"]
    types: [completed]

jobs:
  comment:
    uses: Beneficial-AI-Foundation/veritooling/.github/workflows/verification-comment.yml@v1

name: Lean Verification

on:
  push:
    branches: [ '**' ]
    paths:
      - 'Poc/**'
      - 'Poc.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

env:
  LEAN_ABORT_ON_PANIC: 1

jobs:
  build:
    name: Build Lean Project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify elan installation
        run: |
          elan --version
          lean --version

      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: .lake
          key: ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-${{ hashFiles('Poc/**/*.lean', 'Poc.lean') }}
          restore-keys: |
            ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lakefile.toml') }}-
            ${{ runner.os }}-lean-${{ hashFiles('lean-toolchain') }}-
            ${{ runner.os }}-lean-

      - name: Build Lean project
        run: lake build

      - name: Verify build success
        run: |
          echo "Build successful!"

      - name: Restore base sorry manifest
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          key: sorry-manifest-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.base.sha }}
          path: sorry-manifest.txt

      - name: Prepare base manifest
        if: github.event_name == 'pull_request'
        run: |
          [ -f sorry-manifest.txt ] && mv sorry-manifest.txt sorry-manifest-base.txt || true

      - name: Axiom audit and sorry manifest
        run: lake env lean scripts/Audit.lean

      - name: Save sorry manifest to cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          key: sorry-manifest-main-${{ github.sha }}
          path: sorry-manifest.txt

      - name: Save PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload sorry manifests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sorry-manifests
          path: |
            sorry-manifest.txt
            sorry-manifest-base.txt
            pr-number.txt
          if-no-files-found: ignore
          retention-days: 1

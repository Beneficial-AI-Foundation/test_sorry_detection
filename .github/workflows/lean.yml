name: Lean Verification

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'Poc/**'
      - 'Poc.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/lean.yml'
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

env:
  LEAN_ABORT_ON_PANIC: 1

jobs:
  build:
    name: Build & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      # Same sorry audit as secure-messaging: one composite action restores the
      # baseline, runs collectAxioms, caches the manifest, and uploads artifacts.
      # root-module is auto-detected from lakefile.toml defaultTargets (Poc).
      # (No mathlib here, so none of secure-messaging's disk/cache machinery is
      # needed — the build is seconds.)
      - name: Sorry audit
        uses: Beneficial-AI-Foundation/veritooling/actions/sorry-audit@v1
        with:
          backend: collectaxioms
